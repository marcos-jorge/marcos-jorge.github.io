<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeInMind - Video</title>

    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
        }

        .terminal-box {
            border: 2px solid #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 15px #00ff00;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border: 2px solid #00ff00;
            border-radius: 6px;
            box-shadow: 0 0 15px #00ff00;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        select {
            background-color: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px;
            font-size: 16px;
            margin: 0 auto;
            display: block;
            margin-bottom: 20px;
        }

        .prompt {
            color: #00ff00;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Video player</h1>

    <div class="terminal-box">
        <p class="prompt">Loading resource from YouTube...</p>
        <p class="prompt">Rendering player...</p>
        <p class="prompt">Status: <span style="color:#00ff00;">OK</span></p>
    </div>

    <!-- LISTA DE VIDEOS -->
    <select id="videoList">
        <option value="o617Z2TdbPA">Aprendiendo Inglés – Episodio 1</option>
        <option value="pDGI2M2b48M">CodeInMind – Memory Game</option>
    </select>

    <div class="video-container">
        <iframe id="videoFrame"
            src="https://www.youtube.com/embed/o617Z2TdbPA"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const select = document.getElementById("videoList");
        const iframe = document.getElementById("videoFrame");

        select.addEventListener("change", () => {
            const videoId = select.value;
            iframe.src = `https://www.youtube.com/embed/${videoId}`;
        });
    </script>

</body>
</html>
