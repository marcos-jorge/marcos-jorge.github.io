button{
    margin-top:15px;

    background:rgba(0,20,0,0.6);

    color:#00ff00;

    border:3px solid #00ff00;

    padding:10px 20px;

    font-family:"Courier New", monospace;
    font-size:1.1em;

    text-shadow:0 0 6px #00ff00;

    cursor:pointer;

    transition:all 0.2s ease;
}

button:hover{
    background:rgba(0,40,0,0.7);

    box-shadow:0 0 10px #00ff00;

    text-shadow:0 0 10px #00ff00;
}

button:active{
    transform:scale(0.98);
}

.botones{
    margin-top:15px;
    display:flex;
    gap:10px;
    justify-content:flex-start;

.botones button{
    flex:none;

#translation-box {
    position: absolute;

    background: rgba(0, 20, 0, 0.95);

    color: #00ff00;

    border: 1px solid #00ff00;

    padding: 8px 12px;

    display: none;

    font-family: "Courier New", monospace;

    /*text-shadow: 0 0 6px #00ff00;*/

   /* box-shadow: 0 0 10px #00ff00;*/

    border-radius: 0;

    z-index: 1000;
}
#translation-box::after {
    content: '';

    position: absolute;

    top: 100%;
    left: 50%;

    margin-left: -6px;

    border-width: 6px;
    border-style: solid;

    border-color:
        #00ff00
        transparent
        transparent
        transparent;
}

#translation-panel {

    margin-top: 20px;
    margin-bottom: 20px;

    min-height: 40px;

    border: 3px solid #00ff00;

    background: rgba(0,20,0,0.6);

    color: #00ff00;

    padding: 15px;

    font-family: "Courier New", monospace;

<body>

<h2>Translator</h2>

<textarea
    id="entrada"
    placeholder="Type your text here..."
></textarea>

<div class="botones">
    <button id="btn-procesar">
        TRANSLATE WORDS
    </button>
    <button id="btn-play">
        PLAY
    </button>
</div>

<div id="translation-panel">
    Click a word to see the translation...
</div>

<div id="resultado"></div>

<div id="translation-box"></div>

<script>

const entrada = document.getElementById('entrada');
const btnProcesar = document.getElementById('btn-procesar');
const btnPlay = document.getElementById('btn-play');
const resultado = document.getElementById('resultado');
const cajaTraduccion = document.getElementById('translation-box');
const translationPanel = document.getElementById("translation-panel");

const idiomaOrigen = 'en';
const idiomaDestino = 'es';

const cache = {};

function procesarTexto(){

    const texto = entrada.value.trim();

    if(!texto){
        resultado.innerHTML =
            '<p style="color:#ff6b6b;">Type some text first.</p>';
        return;
    }

    const palabras = texto.split(/(\s+)/);

    let html = '';

    palabras.forEach(palabra => {

        if(palabra.trim() === ''){
            html += palabra;
        }else{
            const segura = palabra.replace(/"/g,'&quot;');

            html += `
                <span
                    class="word"
                    data-text="${segura}"
                >
                    ${palabra}
                </span>
            `;
        }

    });

    resultado.innerHTML = html;
}

async function obtenerTraduccion(palabra){

    if(cache[palabra]){
        return cache[palabra];
    }

    const url =
    `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${idiomaOrigen}&tl=${idiomaDestino}&dt=t&q=${encodeURIComponent(palabra)}`;

    try{

        const response = await fetch(url);
        const data = await response.json();

        if(data && data[0] && data[0][0] && data[0][0][0]){

            const traduccion = data[0][0][0];

            cache[palabra] = traduccion;

            return traduccion;
        }

        return '(no translation)';

    }catch(error){

        console.error(error);

        return '(network error)';
    }
}

resultado.addEventListener('click', async (e) => {

    const span = e.target.closest('.word');

    if (!span) return;

    const palabra = span.dataset.text;

    translationPanel.innerHTML = "Loading...";

    const traduccion =
        await obtenerTraduccion(palabra);

    translationPanel.innerHTML =
        `<strong>${palabra}</strong> → ${traduccion}`;

});

resultado.addEventListener('mouseout',(e)=>{

    const span = e.target.closest('.word');

    if(!span) return;

    setTimeout(()=>{

        if(
            !span.matches(':hover') &&
            !cajaTraduccion.matches(':hover')
        ){
            cajaTraduccion.style.display = 'none';
        }

    },150);

});

document.addEventListener('click',(e)=>{

    if(
        !e.target.closest('.word') &&
        !e.target.closest('#translation-box')
    ){
        cajaTraduccion.style.display = 'none';
    }

});

btnProcesar.addEventListener(
    'click',
    procesarTexto
);

let frases = [];
let indiceFrase = 0;
let estado = "idle";

function hablarFrase() {
    if (indiceFrase >= frases.length) {
        estado = "idle";
        btnPlay.textContent = "PLAY";
        return;
    }

    const u = new SpeechSynthesisUtterance(frases[indiceFrase]);
    u.lang = "en-US";
    u.rate = 0.9;

    u.onend = () => {
        if (estado === "playing") {
            indiceFrase++;
            hablarFrase();
        }
    };

    speechSynthesis.speak(u);
}

btnPlay.addEventListener("click", () => {

    if (estado === "playing") {
        estado = "paused";
        speechSynthesis.cancel();   // corta la frase actual; indiceFrase se conserva
        btnPlay.textContent = "CONTINUE";
        return;
    }

    if (estado === "paused") {
        estado = "playing";
        btnPlay.textContent = "PAUSE";
        hablarFrase();              // repite la frase donde pausaste
        return;
    }

    const texto = resultado.innerText.trim();
    if (!texto) return;

    frases = texto.match(/[^.!?\n]+[.!?]*/g) || [texto];
    indiceFrase = 0;
    estado = "playing";
    btnPlay.textContent = "PAUSE";
    hablarFrase();
});

</script>

</body>
