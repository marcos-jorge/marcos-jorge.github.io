    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: "Courier New", monospace;
            text-align: center;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }

        select, button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 8px 12px;
            font-family: "Courier New", monospace;
            font-size: 18px;
            margin: 10px;
            text-shadow: 0 0 6px #0f0;
            cursor: pointer;
        }

        button:hover {
            background: rgba(0, 40, 0, 0.7);
        }

        #cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            width: 200px;
            height: 100px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding: 10px;
            border: 2px solid #0f0;
        }

        .card-front {
            background: #111;
        }

        .card-back {
            background: #003300;
            transform: rotateY(180deg);
        }

        .card.playing {
            transform: translateY(-5px) scale(1.08);
        }

        .card.playing .card-face {
            box-shadow: 0 0 25px #00ff00;
            border-color: #00ff00;
        }

        .menu-item {
            display: block;
            font-size: 1.3em;
            padding: 10px 0;
            color: #00ff00;
            text-decoration: none;
            border: 2px solid #00ff00;
            width: 200px;
            margin: 40px auto 0 auto;
            text-align: center;
            text-shadow: 0 0 6px #00ff00;
        }

        .menu-item:hover {
            background: rgba(0, 40, 0, 0.7);
            cursor: pointer;
        }

        /* Responsive automático */
        @media (max-width: 900px) {
            .card {
                width: 180px;
                height: 120px;
            }
            .card-face {
                font-size: 18px;
            }
        }

        @media (max-width: 600px) {
            #cards {
                gap: 15px;
            }
            .card {
                width: 150px;
                height: 110px;
            }
            .card-face {
                font-size: 16px;
                padding: 6px;
            }
            select, button {
                font-size: 16px;
                padding: 6px 10px;
            }
            .menu-item {
                width: 160px;
                font-size: 1.1em;
            }
        }

        @media (max-width: 400px) {
            #cards {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 90%;
                height: 120px;
            }
            .card-face {
                font-size: 18px;
            }
        }
    </style>
</head>

            es: {

                estructuras: "Structures", 
                get: "Get",

            }
        };

        const cardsContainer = document.getElementById("cards");
        const selectorTema = document.getElementById("temaSelector");
        const selectorModo = document.getElementById("modoSelector");

        function speak(text, lang) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang;
            utter.rate = 1;
            utter.pitch = 1;
            speechSynthesis.speak(utter);
        }
        let reproduciendo = false;
        let indiceActual = 0;

        function hablarAsync(text, lang) {
            return new Promise(resolve => {

                const utter = new SpeechSynthesisUtterance(text);

                utter.lang = lang;
                utter.rate = 1;
                utter.pitch = 1;

                utter.onend = () => resolve();

                speechSynthesis.speak(utter);
            });
        }

        
        async function reproducirTodas() {

            if (reproduciendo) return;

            reproduciendo = true;

            const tema = selectorTema.value;
            const modo = selectorModo.value;

            for (let i = indiceActual; i < temas[tema].length; i++) {

                if (!reproduciendo) break;

                indiceActual = i;

                const frase = temas[tema][i];

                const texto =
                    modo === "es-en"
                        ? frase.es
                        : frase.en;

                const idioma =
                    modo === "es-en"
                        ? "es-ES"
                        : "en-US";

                await hablarAsync(texto, idioma);

                document.querySelectorAll(".card").forEach(card => card.classList.remove("playing"));

                const tarjetaActual = document.querySelector(`.card[data-index="${i}"]`);
                document.querySelectorAll(".card").forEach(c => c.classList.remove("playing"));
                if (tarjetaActual) tarjetaActual.classList.add("playing");

                await hablarAsync(texto, idioma);
                await esperar(1000);

                if (tarjetaActual) tarjetaActual.classList.remove("playing");}

                reproduciendo = false;

                const boton = document.getElementById("playAllBtn");

                if (indiceActual >= temas[tema].length - 1) {

                    indiceActual = 0;

                    boton.textContent =
                        selectorModo.value === "es-en"
                            ? "🔊 Escuchar todas"
                            : "🔊 Play All";
            }
        }

        function actualizarNombresTemas() {
            const idioma = selectorModo.value === "es-en" ? "es" : "en";
            selectorTema.options[0].text = temasNombres[idioma].basico;
            selectorTema.options[1].text = temasNombres[idioma].preguntas;
            selectorTema.options[2].text = temasNombres[idioma].viajes;
            selectorTema.options[3].text = temasNombres[idioma].estructuras;
            selectorTema.options[4].text = temasNombres[idioma].get;
            selectorTema.options[5].text = temasNombres[idioma].saludos;
            selectorTema.options[6].text = temasNombres[idioma].aeropuerto;
            selectorTema.options[7].text = temasNombres[idioma].hotel;
            selectorTema.options[8].text = temasNombres[idioma].restaurante;
            selectorTema.options[9].text = temasNombres[idioma].compras;
            selectorTema.options[10].text = temasNombres[idioma].emergencias;
            selectorTema.options[11].text = temasNombres[idioma].transporte;
            selectorTema.options[12].text = temasNombres[idioma].hogar;
            
            document.getElementById("mezclarBtn").textContent =
            idioma === "es" ? "Mezclar" : "Shuffle";

            document.getElementById("playAllBtn").textContent =
            idioma === "es" ? "Escuchar todas" : "Play All";

        }

        function mezclarArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function cargarTarjetas() {
            const tema = selectorTema.value;
            const modo = selectorModo.value;

            cardsContainer.innerHTML = "";

            temas[tema].forEach((frase, index) => {
                const card = document.createElement("div");
                card.classList.add("card");

                let frontText = modo === "es-en" ? frase.es : frase.en;
                let backText = modo === "es-en" ? frase.en : frase.es;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">${frontText}</div>
                        <div class="card-face card-back">${backText}</div>
                    </div>
                `;

                card.addEventListener("click", () => {
                    const flipped = card.classList.toggle("flipped");
                    if (flipped) {
                        speak(backText, modo === "es-en" ? "en-US" : "es-ES");
                    }
                });
                card.dataset.index = index;
                cardsContainer.appendChild(card);
            });
        }

        function esperar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }   

        actualizarNombresTemas();
        cargarTarjetas();

        selectorTema.addEventListener("change", () => {

            reproduciendo = false;
            indiceActual = 0;

            speechSynthesis.cancel();

            cargarTarjetas();
        });

        document.getElementById("mezclarBtn").addEventListener("click", () => {

            const tema = selectorTema.value;

            reproduciendo = false;
            indiceActual = 0;

            speechSynthesis.cancel();

            mezclarArray(temas[tema]);
            cargarTarjetas();
        
            document.getElementById("playAllBtn").textContent =
                selectorModo.value === "es-en"
                    ? "Escuchar todas"
                    : "Play All";
        });

        document.getElementById("playAllBtn").addEventListener("click", () => {

        const boton = document.getElementById("playAllBtn");

        if (!reproduciendo) {

            boton.textContent =
                selectorModo.value === "es-en"
                    ? "⏹ Detener"
                    : "⏹ Stop";

            reproducirTodas();

        } else {

            reproduciendo = false;

            speechSynthesis.cancel();

            boton.textContent =
                selectorModo.value === "es-en"
                    ? "▶ Continuar"
                    : "▶ Continue";
        }

    });

    selectorModo.addEventListener("change", () => {
        // Parar la reproducción y resetear el contador
        reproduciendo = false;
        indiceActual = 0;
        speechSynthesis.cancel();

        // Actualizar textos de temas y botones al nuevo idioma
        actualizarNombresTemas();

        // Regenerar las tarjetas con el nuevo modo
        cargarTarjetas();
    });
